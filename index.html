<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="screen">
            <span class="screen-digits"></span>
        </div>

        <div class="keyboard">

            <button class="btn ce">CE</button>
            <button class="btn div">/</button>
            <button class="btn mod">%</button>
            <button class="btn mul">*</button>

            <button class="btn seven">7</button>
            <button class="btn eight">8</button>
            <button class="btn nine">9</button>
            <!-- <button class="tall">+</button> -->
             <button class="btn plus">+</button>

            <button class="btn four">4</button>
            <button class="btn five">5</button>
            <button class="btn six">6</button>
            <button class="btn minus">-</button>

            <button class="btn one">1</button>
            <button class="btn two">2</button>
            <button class="btn three">3</button>
            <button class="tall btn equal">=</button>

            <button class="zero btn">0</button>
            <button class="btn dot">.</button>
            <button class="btn">x</button>

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
